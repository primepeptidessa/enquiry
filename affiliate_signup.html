<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Affiliate Customer Signup</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 12px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            width: 100%;
            max-width: 500px;
            padding: 40px;
        }

        h1 {
            color: #333;
            margin-bottom: 10px;
            font-size: 28px;
        }

        .subtitle {
            color: #666;
            margin-bottom: 30px;
            font-size: 14px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: 500;
            font-size: 14px;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-size: 14px;
            transition: border-color 0.3s;
        }

        input:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .code-group {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        .code-group input {
            flex: 1;
        }

        .code-group input:read-only {
            background: #f5f5f5;
            cursor: not-allowed;
        }

        button {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.3);
        }

        button:active {
            transform: translateY(0);
        }

        .message {
            padding: 12px;
            border-radius: 6px;
            margin-bottom: 20px;
            font-size: 14px;
            display: none;
        }

        .message.success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
            display: block;
        }

        .message.error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
            display: block;
        }

        .loading {
            opacity: 0.6;
            pointer-events: none;
        }

        .spinner {
            display: inline-block;
            width: 14px;
            height: 14px;
            border: 2px solid rgba(255,255,255,0.3);
            border-radius: 50%;
            border-top-color: white;
            animation: spin 0.8s linear infinite;
            margin-right: 8px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Add New Customer</h1>
        <p class="subtitle">Register your customer with us</p>

        <div id="message" class="message"></div>

        <form id="signupForm">
            <div class="form-group">
                <label for="affiliateCode">Affiliate Code *</label>
                <input type="text" id="affiliateCode" name="affiliateCode" placeholder="Enter your affiliate code" required>
            </div>

            <hr style="margin: 30px 0; border: none; border-top: 1px solid #eee;">
            <h3 style="color: #333; margin-bottom: 20px; font-size: 18px;">New Customer Details</h3>

            <div class="form-group">
                <label for="customerName">Customer Name *</label>
                <input type="text" id="customerName" name="customerName" placeholder="Full name" required>
            </div>

            <div class="form-group">
                <label for="customerEmail">Email *</label>
                <input type="email" id="customerEmail" name="customerEmail" placeholder="email@example.com" required>
            </div>

            <div class="form-group">
                <label for="customerPhone">Phone Number *</label>
                <input type="tel" id="customerPhone" name="customerPhone" placeholder="+27..." required>
            </div>

            <button type="submit">Create Customer</button>
        </form>
    </div>

    <script>
        const form = document.getElementById('signupForm');
        const messageDiv = document.getElementById('message');

        form.addEventListener('submit', async (e) => {
            e.preventDefault();

            const affiliateCode = document.getElementById('affiliateCode').value.trim().toUpperCase();
            const customerName = document.getElementById('customerName').value.trim();
            const customerEmail = document.getElementById('customerEmail').value.trim();
            const customerPhone = document.getElementById('customerPhone').value.trim();

            // Validate
            if (!affiliateCode || !customerName || !customerEmail || !customerPhone) {
                showMessage('All fields are required', 'error');
                return;
            }

            if (!customerEmail.includes('@')) {
                showMessage('Please enter a valid email', 'error');
                return;
            }

            // Submit
            form.querySelector('button').classList.add('loading');
            form.querySelector('button').innerHTML = '<span class="spinner"></span>Creating...';

            try {
                const response = await fetch('/api/affiliate/signup', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        affiliate_code: affiliateCode,
                        customer_name: customerName,
                        customer_email: customerEmail,
                        customer_phone: customerPhone
                    })
                });

                const data = await response.json();

                if (!response.ok) {
                    showMessage(data.error || 'Error creating customer', 'error');
                    return;
                }

                showMessage(`Customer "${customerName}" created successfully!`, 'success');
                form.reset();
                setTimeout(() => {
                    messageDiv.textContent = '';
                }, 3000);

            } catch (error) {
                showMessage('Network error: ' + error.message, 'error');
            } finally {
                form.querySelector('button').classList.remove('loading');
                form.querySelector('button').innerHTML = 'Create Customer';
            }
        });

        function showMessage(text, type) {
            messageDiv.textContent = text;
            messageDiv.className = 'message ' + type;
        }
    </script>
</body>
</html>
